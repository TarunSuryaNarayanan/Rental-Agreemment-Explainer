<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rental Agreement Explainer</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;color:#222}
 textarea{width:100%;height:220px;padding:.6rem;font-family:inherit}
 .row{display:flex;gap:.6rem;align-items:center;margin:.6rem 0}
 button{padding:.5rem 1.1rem;border:0;border-radius:6px;background:#2d5be3;color:#fff;cursor:pointer}
 .card{border:1px solid #ddd;border-radius:8px;padding:.8rem 1rem;margin:.7rem 0}
 .tag{display:inline-block;padding:.1rem .5rem;border-radius:99px;font-size:.8rem;color:#fff}
 .Standard, .Present{background:#2e8b57}.Unusual{background:#d98e04}.One-sided, .Missing{background:#c62828}.Incomplete{background:#4a6fa5}.Error{background:#d9534f}
 blockquote{margin:.4rem 0;padding-left:.7rem;border-left:3px solid #aaa;color:#555;font-size:.9rem}
 .warn{color:#c62828;font-size:.85rem}.muted{color:#777;font-size:.85rem}
 .panel{background:#f6f8ff}
</style></head><body>
<h1>Rental Agreement Explainer</h1>
<p class="muted">Paste your rental agreement. Every explanation is backed by a quote that is automatically checked against your text.</p>
<textarea id="text" placeholder="Paste agreement text here..."></textarea>
<div class="row">
 <label>Strategy
  <select id="strategy">{% for s in strategies %}<option {% if s=='few_shot' %}selected{% endif %}>{{s}}</option>{% endfor %}</select>
 </label>
 <button onclick="run()">Explain</button><span id="status" class="muted"></span>
</div>
<div id="out"></div>
<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function run(){
  const out=document.getElementById("out"),st=document.getElementById("status");
  st.textContent="Analyzing..."; out.innerHTML="";
  const r=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({text:document.getElementById("text").value,strategy:document.getElementById("strategy").value})});
  const d=await r.json(); st.textContent="";
  if(d.error){out.innerHTML=`<p class="warn">${esc(d.error)}</p>`;return;}
  let h=`<div class="card panel"><b>Key Terms Summary</b>`;
  h+=d.key_terms.map(k=>`
    <div style="margin:0.5rem 0; padding-bottom:0.4rem; border-bottom:1px solid #eee;">
      <div>• <b>${esc(k.category || k.key)}</b> (${esc(k.key)})
        ${k.section_ref && k.section_ref !== 'Not Found' ? `<span class="muted">[${esc(k.section_ref)}]</span>` : ''}: 
        <span class="tag ${esc(k.status || k.label)}">${esc(k.status || k.label)}</span>
        <span class="muted" style="font-size:0.8rem; margin-left:0.4rem;">
          [Presence: <b>${esc(k.presence)}</b> | Completeness: <b>${esc(k.completeness)}</b> | Compliance: <b>${esc(k.legal_compliance)}</b> | Risk: <b>${esc(k.risk_level)}</b>]
        </span>
      </div>
      ${k.verification_type ? `<div style="font-size:0.82rem; color:#2d5be3; margin-top:0.1rem;">Verification Detail: <b>${esc(k.verification_type)}</b></div>` : ''}
      ${k.registration_type ? `<div style="font-size:0.82rem; color:#2d5be3; margin-top:0.1rem;">Registration Detail: <b>${esc(k.registration_type)}</b></div>` : ''}
      <div class="muted" style="font-size:0.85rem; margin-top:0.1rem;">${esc(k.description)}</div>
      ${k.quote?`<blockquote style="margin-top:0.2rem;">${esc(k.quote)}</blockquote>`:""}
    </div>`).join("")||"<div class='muted'>None detected</div>";
  h+=`</div><div class="card panel"><b>Agreement Checklist</b>`;
  const cleanList = (arr) => Array.from(new Set(arr || []));
  if (d.checklist.present && d.checklist.present.length) {
    h+=`<div><span style="color:#2e8b57;font-weight:bold">✓ Present:</span> ${cleanList(d.checklist.present).map(esc).join(", ")}</div>`;
  }
  if (d.checklist.incomplete && d.checklist.incomplete.length) {
    h+=`<div style="margin-top:0.3rem"><span style="color:#d98e04;font-weight:bold">⚠ Needs Details / Incomplete:</span> ${cleanList(d.checklist.incomplete).map(esc).join(", ")}</div>`;
  }
  if (d.checklist.missing && d.checklist.missing.length) {
    h+=`<div style="margin-top:0.3rem"><span class="warn" style="font-weight:bold">✗ Missing from agreement:</span> ${cleanList(d.checklist.missing).map(esc).join(", ")}</div>`;
  }
  h+=`</div>`;
  h+=`<p class="muted">Faithfulness: ${d.stats.verified_quotes}/${d.stats.n_clauses} quotes verified</p>`;
  h+=d.clauses.map(c=>`<div class="card"><span class="tag ${c.label}">${c.label}</span> ${c.is_incomplete?`<span class="tag Incomplete">Needs Details</span>`:""} <b>${esc(c.clause_type)}</b>
    <p>${esc(c.explanation)}</p><div class="muted">${esc(c.label_reason)}</div>
    ${c.error?`<div class="warn">⚠ ${esc(c.error)}</div>`:
      `<blockquote>${esc(c.quote)} ${c.verified?"✓ verified":"<span class='warn'>⚠ quote not found, treat with caution</span>"}</blockquote>`}
    ${c.advice?`<div class="warn">${esc(c.advice)}</div>`:""}</div>`).join("");
  h+=`<p class="muted">${esc(d.disclaimer)}</p>`; out.innerHTML=h;
}
</script></body></html>
